                                                    <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Rounds</label>
                                                    <div className="flex items-center gap-2 rounded-xl border border-border p-2" style={{ background: '#1e1e22' }}>
                                                        <button onClick={() => setAddSets(s => Math.max(1, s - 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted" style={{ background: '#161618' }}><i className="ph-bold ph-minus text-sm"></i></button>
                                                        <span className="flex-1 text-center font-teko text-2xl font-bold text-textMain">{addSets}</span>
                                                        <button onClick={() => setAddSets(s => Math.min(5, s + 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted" style={{ background: '#161618' }}><i className="ph-bold ph-plus text-sm"></i></button>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Target Reps</label>
                                                    <input type="text" value={addReps} onChange={e => setAddReps(e.target.value)} placeholder={addModal.ex.reps || "e.g. 8-10"} className="w-full rounded-xl px-3 py-2.5 text-sm font-medium text-textMain placeholder-textMuted/40 focus:ring-0 border border-border" style={{ background: '#1e1e22' }} />
                                                </div>
                                            </div>
                                            <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Drop Weights (kg) — optional</label>
                                            <div className="flex gap-2">
                                                {dropWeights.map((w, i) => (
                                                    <div key={i} className="flex-1">
                                                        <div className="text-[9px] text-textMuted text-center mb-1">Drop {i + 1}</div>
                                                        <input type="number" value={w} onChange={e => { const d = [...dropWeights]; d[i] = e.target.value; setDropWeights(d); }} placeholder="kg" className="w-full rounded-lg px-2 py-2 text-sm font-bold text-center text-textMain border border-border focus:ring-0" style={{ background: '#1e1e22' }} />
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="mt-2 text-[10px] text-textMuted/60 text-center">Each drop = reduce weight, continue immediately to failure</div>
                                        </div>
                                    )}

                                    {/* SUPERSET */}
                                    {addSetType === "superset" && (
                                        <div className="mb-5">
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <div>
                                                    <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Sets</label>
                                                    <div className="flex items-center gap-2 rounded-xl border border-border p-2" style={{ background: '#1e1e22' }}>
                                                        <button onClick={() => setAddSets(s => Math.max(1, s - 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted" style={{ background: '#161618' }}><i className="ph-bold ph-minus text-sm"></i></button>
                                                        <span className="flex-1 text-center font-teko text-2xl font-bold text-textMain">{addSets}</span>
                                                        <button onClick={() => setAddSets(s => Math.min(10, s + 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted" style={{ background: '#161618' }}><i className="ph-bold ph-plus text-sm"></i></button>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Reps Each</label>
                                                    <input type="text" value={addReps} onChange={e => setAddReps(e.target.value)} placeholder={addModal.ex.reps || "10-12"} className="w-full rounded-xl px-3 py-2.5 text-sm font-medium text-textMain placeholder-textMuted/40 focus:ring-0 border border-border" style={{ background: '#1e1e22' }} />
                                                </div>
                                            </div>
                                            <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Exercise 1</label>
                                            <div className="rounded-xl px-3 py-2.5 mb-3 border border-border text-sm font-bold text-textMain" style={{ background: '#111' }}>{addModal.ex.name}</div>
                                            <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Exercise 2 (paired)</label>
                                            <input type="text" value={addExercise2} onChange={e => setAddExercise2(e.target.value.toUpperCase())} placeholder="e.g. MACHINE CHEST FLYES" className="w-full rounded-xl px-3 py-2.5 text-sm font-medium text-textMain placeholder-textMuted/40 focus:ring-0 border border-border uppercase" style={{ background: '#1e1e22' }} />
                                            <div className="mt-2 text-[10px] text-textMuted/60 text-center">Both exercises added. Zero rest between them.</div>
                                        </div>
                                    )}

                                    {/* PYRAMID */}
                                    {addSetType === "pyramid" && (
                                        <div className="mb-5">
                                            <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Rounds</label>
                                            <div className="flex items-center gap-2 rounded-xl border border-border p-2 mb-3" style={{ background: '#1e1e22', maxWidth: 140 }}>
                                                <button onClick={() => setPyramidRounds(r => Math.max(1, r - 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted" style={{ background: '#161618' }}><i className="ph-bold ph-minus text-sm"></i></button>
                                                <span className="flex-1 text-center font-teko text-2xl font-bold text-textMain">{pyramidRounds}</span>
                                                <button onClick={() => setPyramidRounds(r => Math.min(3, r + 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted" style={{ background: '#161618' }}><i className="ph-bold ph-plus text-sm"></i></button>
                                            </div>
                                            <div className="rounded-xl p-3 border border-white/5" style={{ background: 'rgba(0,0,0,0.3)' }}>
                                                <div className="text-[10px] font-bold text-textMuted uppercase tracking-wider mb-2">Generated Sets ({pyramidRounds * 4} total)</div>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {Array.from({ length: pyramidRounds }).map((_, r) =>
                                                        ["×20", "×15", "×10", "×fail"].map((rep, i) => (
                                                            <span key={`${r}-${i}`} className="text-[10px] font-mono px-2 py-1 rounded" style={{ background: '#1e1e22', color: '#3b82f6', border: '1px solid #3b82f620' }}>Set {r * 4 + i + 1} {rep}</span>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                            <div className="mt-2 text-[10px] text-textMuted/60 text-center">30 sec rest between sets · 2 min between rounds</div>
                                        </div>
                                    )}

                                    {/* Program info */}
                                    <div className="flex items-start gap-2 mb-5 rounded-xl p-3 border border-white/5" style={{ background: 'rgba(0,0,0,0.3)' }}>
                                        <i className="ph-fill ph-info text-textMuted/50 mt-0.5 shrink-0 text-xs"></i>
                                        <div className="text-[11px] text-textMuted leading-relaxed">
                                            <span className="text-textMain font-medium">Program default:</span> {addModal.ex.sets} sets × {addModal.ex.reps} · {addModal.ex.rest} rest
                                        </div>
                                    </div>

                                    <button onClick={confirmAddExercise} disabled={addStatus === "Adding..."} className="w-full py-4 rounded-2xl text-white font-bold text-sm tracking-wide transition-all active:scale-[0.98]" style={{ background: '#3b82f6', boxShadow: '0 8px 24px rgba(59,130,246,0.35)' }}>
                                        {addStatus || "Add to Today's Workout"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <div className="rounded-2xl p-5 mb-5" style={{ background: '#161618', border: '1px solid rgba(255,255,255,0.07)', borderLeft: '3px solid #3b82f6' }}>
                        <div className="text-[10px] font-bold uppercase tracking-[0.25em] mb-1.5" style={{ color: '#3b82f6' }}>The Master · 8-Day Rotation Split</div>
                        <h1 className="text-2xl font-black text-textMain tracking-tight mb-1">8-Day Workout Split</h1>
                        <div className="text-[12px] text-textMuted">3 Days On · 1 Day Off · Double Progression Loading</div>
                        <div className="flex gap-2 mt-4">
                            {[["split", "📋 Split"], ["rules", "⚖️ Rules"]].map(([id, label]) => (
                                <button key={id} onClick={() => setActiveTab(id)} className="px-4 py-2 rounded-lg text-xs font-bold transition-all border"
                                    style={{ background: activeTab === id ? '#3b82f6' : '#1e1e22', color: activeTab === id ? '#fff' : '#8a8a96', borderColor: activeTab === id ? '#3b82f6' : 'rgba(255,255,255,0.07)' }}>
                                    {label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div>
                        {activeTab === "split" && (
                            <>
                                {/* Day chips */}
                                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-1 px-1 mb-5">
                                    {DAYS.map((d) => (
                                        <button key={d.id} onClick={() => { setActiveDay(d.id); setExpandedEx(null); }} className="shrink-0 rounded-xl transition-all text-center"
                                            style={{ padding: "10px 14px", background: activeDay === d.id ? d.color : '#1e1e22', color: activeDay === d.id ? '#fff' : d.rest ? '#555' : '#888', border: `1px solid ${activeDay === d.id ? d.color : 'rgba(255,255,255,0.07)'}`, minWidth: 76, fontWeight: "bold", fontSize: 12, lineHeight: 1.4 }}>
                                            <div style={{ fontSize: 15 }}>{d.emoji}</div>
                                            <div style={{ fontFamily: 'Inter, sans-serif' }}>{d.label}</div>
                                            <div style={{ fontWeight: "normal", fontSize: 10, opacity: 0.75 }}>{d.rest ? "REST" : d.focus.split(" & ")[0]}</div>
                                        </button>
                                    ))}
                                </div>

                                {/* Day header */}
                                <div className="rounded-2xl p-4 mb-4 flex items-center gap-3" style={{ background: currentDay.color + '14', border: `1px solid ${currentDay.color}33`, borderLeft: `4px solid ${currentDay.color}` }}>
                                    <span style={{ fontSize: 28 }}>{currentDay.emoji}</span>
                                    <div className="flex-1">
                                        <div className="text-[10px] font-bold uppercase tracking-[0.2em] mb-0.5" style={{ color: currentDay.color }}>{currentDay.label}</div>
                                        <div className="text-lg font-black text-textMain">{currentDay.focus}</div>
                                    </div>
                                    {!currentDay.rest && (
                                        <div className="text-right">
                                            <div className="text-[10px] text-textMuted uppercase tracking-wider">Exercises</div>
                                            <div className="text-2xl font-teko font-bold text-textMain leading-none">{currentDay.exercises?.length || 0}</div>
                                        </div>
                                    )}
                                </div>

                                {currentDay.rest && (
                                    <div className="rounded-2xl p-10 text-center" style={{ background: '#161618', border: '1px solid rgba(255,255,255,0.07)' }}>
                                        <div style={{ fontSize: 50, marginBottom: 12 }}>😴</div>
                                        <div className="text-lg font-bold text-textMuted mb-2">Full Rest Day</div>
                                        <div className="text-xs text-textMuted/50">No training · No cardio · Sleep 8+ hours</div>
                                        <div className="text-xs text-textMuted/30 mt-2 italic">Recovery is where the muscle is actually built.</div>
                                    </div>
                                )}

                                {!currentDay.rest && (
                                    <div className="space-y-2">
                                        {currentDay.exercises.map((ex, i) => {
                                            const isExpanded = expandedEx === i;
                                            const tagColor = TAG_COLORS[ex.tag] || '#555';
                                            return (
                                                <div key={i} className="rounded-2xl overflow-hidden transition-all" style={{ background: isExpanded ? '#1a1a1e' : '#161618', border: `1px solid ${isExpanded ? currentDay.color + '44' : 'rgba(255,255,255,0.07)'}` }}>
                                                    <div onClick={() => setExpandedEx(isExpanded ? null : i)} className="flex items-center gap-3 p-4 cursor-pointer">
                                                        <div className="w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-xs font-bold text-white" style={{ background: currentDay.color }}>{i + 1}</div>
                                                        <div className="flex-1 min-w-0">
                                                            {/* FIX 1: Show full name when collapsed (removed truncate), still wraps */}
                                                            <div className="text-sm font-semibold text-textMain leading-tight">{ex.name}</div>
                                                            {ex.tag && (
                                                                <span className="text-[9px] font-bold uppercase tracking-wider mt-0.5 inline-block px-1.5 py-0.5 rounded" style={{ background: tagColor + '22', color: tagColor, border: `1px solid ${tagColor}44` }}>{ex.tag}</span>
                                                            )}
                                                        </div>
                                                        <div className="flex gap-3 shrink-0">
                                                            <div className="text-center">
                                                                <div className="text-base font-bold leading-none" style={{ color: currentDay.color }}>{ex.sets}</div>
                                                                <div className="text-[9px] text-textMuted uppercase tracking-wider mt-0.5">sets</div>
                                                            </div>
                                                            <div className="text-center">
                                                                <div className="text-base font-bold text-textMain leading-none">{ex.reps}</div>
                                                                <div className="text-[9px] text-textMuted uppercase tracking-wider mt-0.5">reps</div>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            <button onClick={(e) => { e.stopPropagation(); openAddModal(ex, currentDay.color); }}
                                                                className="w-8 h-8 rounded-lg flex items-center justify-center transition-all active:scale-95"
                                                                style={{ background: '#3b82f615', border: '1px solid #3b82f640', color: '#3b82f6' }}
                                                                title="Add to workout">
                                                                <i className="ph-bold ph-plus text-sm"></i>
                                                            </button>
                                                            <div className="text-textMuted/30 text-[10px] transition-transform duration-200" style={{ transform: isExpanded ? 'rotate(180deg)' : 'none' }}>▼</div>
                                                        </div>
                                                    </div>
                                                    {isExpanded && (
                                                        <div className="px-4 pb-4 border-t border-white/5">
                                                            <div className="grid grid-cols-2 gap-2 mt-3">
                                                                {[["⚖️ Weight Method", ex.weightMethod, true], ["⏱ Tempo", ex.tempo, false], ["😮‍💨 Rest", ex.rest, false]].map(([label, value, full]) => (
                                                                    <div key={label} className="rounded-xl p-3" style={{ background: '#111113', border: '1px solid rgba(255,255,255,0.06)', gridColumn: full ? '1 / -1' : 'auto' }}>
                                                                        <div className="text-[9px] font-bold uppercase tracking-wider text-textMuted/50 mb-1.5">{label}</div>
                                                                        <div className="text-xs text-textMain/75 leading-relaxed">{value}</div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                            <div className="mt-2 rounded-xl p-3" style={{ background: currentDay.color + '0d', border: `1px solid ${currentDay.color}2a` }}>
                                                                <div className="text-[9px] font-bold uppercase tracking-wider mb-1.5" style={{ color: currentDay.color }}>📌 Key Note</div>
                                                                <div className="text-xs leading-relaxed" style={{ color: '#ccc' }}>{ex.notes}</div>
                                                            </div>
                                                            <button onClick={() => openAddModal(ex, currentDay.color)} className="mt-3 w-full py-2.5 rounded-xl text-sm font-bold transition-all active:scale-[0.98] flex items-center justify-center gap-2" style={{ background: '#3b82f615', border: '1px solid #3b82f640', color: '#3b82f6' }}>
                                                                <i className="ph-bold ph-plus-circle"></i> Add to Today's Workout
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </>
                        )}

                        {activeTab === "rules" && (
                            <div>
                                <div className="mb-4">
                                    <div className="text-xl font-bold text-textMain mb-1">Weight & Rep Rules</div>
                                    <div className="text-xs text-textMuted">CBum's exact loading philosophy — applies to every exercise in the split</div>
                                </div>
                                <div className="space-y-2">
                                    {RULES.map((r, i) => (
                                        <div key={i} className="rounded-xl p-4 flex gap-3" style={{ background: i % 2 === 0 ? '#161618' : '#131315', border: '1px solid rgba(255,255,255,0.06)' }}>
                                            <div className="w-7 h-7 rounded-full shrink-0 flex items-center justify-center text-xs font-bold" style={{ background: '#C0392B22', border: '1px solid #C0392B44', color: '#C0392B' }}>{i + 1}</div>
                                            <div>
                                                <div className="text-[11px] font-bold uppercase tracking-wide mb-1" style={{ color: '#C0392B' }}>{r.rule}</div>
                                                <div className="text-xs text-textMain/70 leading-relaxed">{r.method}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ProfileSelector = ({ onSelect }) => (
            <div className="fade-in pt-10 px-6">
                <h2 className="text-3xl font-teko font-bold text-textMain mb-1 text-center uppercase tracking-wide">Profiles</h2>
                <p className="text-[10px] text-textMuted uppercase tracking-widest mb-10 text-center">Select athlete</p>
                <div className="space-y-5 stagger-children">
                    {Object.entries(USER_DATA).map(([key, data]) => (
                        <div key={key} onClick={() => onSelect(key)} className="glass-panel rounded-3xl h-36 flex items-center justify-center cursor-pointer hover:bg-white/[0.04] active:scale-[0.98] transition-all duration-300 group relative overflow-hidden slide-up" style={{ boxShadow: '0 4px 24px rgba(0,0,0,0.3)' }}>
                            <div className={`absolute right-[-20px] top-[-20px] w-40 h-40 rounded-full blur-3xl opacity-15 group-hover:opacity-30 transition-opacity duration-500 ${data.bg}`}></div>
                            <div className={`absolute left-[-20px] bottom-[-20px] w-32 h-32 rounded-full blur-3xl opacity-10 group-hover:opacity-20 transition-opacity duration-500 ${data.bg}`}></div>
                            <div className="relative z-10 flex flex-col items-center gap-1">
                                <h3 className={`text-5xl font-teko font-bold uppercase tracking-wide ${data.color}`}>{data.name}</h3>
                                <div className={`h-0.5 w-8 rounded-full ${data.bg} opacity-60 group-hover:w-16 transition-all duration-500`}></div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const ProfileStats = ({ userKey, allHistory, onBack }) => {
            const staticData = USER_DATA[userKey];
            const profileData = allHistory?.profiles?.[userKey] || {};
            const height = profileData.height || staticData.height;
            const dob = profileData.dob || staticData.dob;

            const [showWeightChart, setShowWeightChart] = useState(false);
            const [showBMIChart, setShowBMIChart] = useState(false);
            const [localHeight, setLocalHeight] = useState(height);
            const [isEditingHeight, setIsEditingHeight] = useState(false);

            useEffect(() => { setLocalHeight(height); }, [height]);

            const saveHeight = () => {
                if (window.db) window.update(window.ref(window.db, `profiles/${userKey}`), { height: localHeight }).then(() => setIsEditingHeight(false)).catch(console.error);
            };

            const age = calculateAge(dob);

            const weightHistory = useMemo(() => {
                if(!allHistory) return [];
                const history = [];
                Object.entries(allHistory).forEach(([date, dayData]) => {
                    const bw = dayData[userKey]?.bodyWeight;
                    if(bw) history.push({ date, value: bw });
                });
                return history.sort((a,b) => new Date(a.date) - new Date(b.date));
            }, [allHistory, userKey]);

            const currentWeight = weightHistory.length > 0 ? parseFloat(weightHistory[weightHistory.length - 1].value) : 0;
            const displayHeight = isEditingHeight ? localHeight : height;
            const bmi = currentWeight > 0 ? (currentWeight / ((displayHeight/100) ** 2)).toFixed(1) : "--";
            const bmiHistory = weightHistory.map(w => ({ date: w.date, value: (parseFloat(w.value) / ((displayHeight/100) ** 2)).toFixed(1) }));

            const focusStats = useMemo(() => {
                if (!allHistory) return [];
                const stats = {};
                const validDates = Object.keys(allHistory).filter(k => k.match(/^\d{4}-\d{2}-\d{2}$/));
                validDates.forEach(date => {
                    const dayData = allHistory[date];
                    const uData = dayData[userKey];
                    if (uData && uData.exercises && uData.exercises.length > 0) {
                        const dateObj = new Date(date);
                        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                        const monthLabel = dateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                        let rawSplit = dayData.split || uData.split || "Unknown";
                        if(rawSplit === "Rest") return;
                        if (!stats[monthKey]) stats[monthKey] = { label: monthLabel, counts: {}, total: 0 };
                        rawSplit.split(', ').forEach(split => { stats[monthKey].counts[split] = (stats[monthKey].counts[split] || 0) + 1; });
                        stats[monthKey].total += 1;
                    }
                });
                return Object.entries(stats).sort((a, b) => b[0].localeCompare(a[0])).map(([key, val]) => val);
            }, [allHistory, userKey]);

            return (
                <div className="fade-in pt-4 px-5 pb-10">
                    <button onClick={onBack} className="mb-6 flex items-center gap-2 text-textMuted hover:text-white"><i className="ph-bold ph-arrow-left"></i> Back to profiles</button>
                    <div className="mb-8">
                        <h1 className={`text-4xl font-teko font-bold uppercase ${staticData.color}`}>{staticData.name}</h1>
                        <p className="text-sm text-textMuted font-mono uppercase tracking-widest">Born: {dob}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="glass-panel rounded-3xl p-5 flex flex-col justify-between h-40">
                            <div className="text-textMuted"><i className="ph-duotone ph-cake text-2xl"></i></div>
                            <div><span className="text-4xl font-bold text-textMain">{age}</span><span className="text-xs text-textMuted font-bold uppercase tracking-wider block">Years Old</span></div>
                        </div>
                        <div className="glass-panel rounded-3xl p-5 flex flex-col justify-between h-40 relative group">
                            <button onClick={() => { if (isEditingHeight) saveHeight(); else setIsEditingHeight(true); }} className={`absolute top-4 right-4 p-2 rounded-full transition-colors ${isEditingHeight ? 'bg-secondary text-white shadow-neon-green' : 'text-textMuted hover:text-white bg-white/5'}`}>
                                <i className={`ph-bold ${isEditingHeight ? 'ph-check' : 'ph-pencil-simple'}`}></i>
                            </button>
                            <div className="text-textMuted"><i className="ph-duotone ph-ruler text-2xl"></i></div>
                            <div>
                                {isEditingHeight ? <input type="number" autoFocus value={localHeight} onChange={(e) => setLocalHeight(e.target.value)} className="text-4xl font-bold text-textMain bg-transparent border-b border-white/20 w-24 p-0 focus:ring-0" /> : <span className="text-4xl font-bold text-textMain">{height}</span>}
                                <span className="text-xs text-textMuted font-bold uppercase tracking-wider block">CM Height</span>
                            </div>
                        </div>
                        <div onClick={() => setShowWeightChart(true)} className="glass-panel rounded-3xl p-5 flex flex-col justify-between h-40 col-span-2 cursor-pointer hover:bg-white/5 transition-colors relative overflow-hidden">
                            <div className={`absolute right-[-20px] top-[-20px] w-40 h-40 rounded-full blur-3xl opacity-10 ${staticData.bg}`}></div>
                            <div className="flex justify-between items-start"><div className="text-textMuted"><i className="ph-duotone ph-scales text-2xl"></i></div><i className="ph-bold ph-chart-line-up text-textMuted"></i></div>
                            <div><span className="text-5xl font-bold text-textMain">{currentWeight || "--"}</span><span className="text-sm text-textMuted font-bold uppercase tracking-wider ml-1">KG</span><span className="text-xs text-textMuted font-bold uppercase tracking-wider block mt-1">Current Weight</span></div>
                        </div>
                        <div onClick={() => setShowBMIChart(true)} className="glass-panel rounded-3xl p-5 flex flex-col justify-between h-40 col-span-2 cursor-pointer hover:bg-white/5 transition-colors relative overflow-hidden">
                            <div className="flex justify-between items-start"><div className="text-textMuted"><i className="ph-duotone ph-activity text-2xl"></i></div><i className="ph-bold ph-chart-bar text-textMuted"></i></div>
                            <div><span className={`text-5xl font-bold ${bmi > 25 ? 'text-orange-400' : bmi < 18.5 ? 'text-blue-400' : 'text-green-400'}`}>{bmi}</span><span className="text-xs text-textMuted font-bold uppercase tracking-wider block mt-1">BMI Score</span></div>
                        </div>
                    </div>
                    <div className="mt-6">
                        <h3 className="text-lg font-bold text-textMain mb-3 uppercase tracking-wider">Monthly Focus Breakdown</h3>
                        <div className="space-y-3">
                            {focusStats.map((stat, i) => (
                                <div key={i} className="glass-panel rounded-2xl p-4">
                                    <div className="flex justify-between items-end mb-3 border-b border-white/5 pb-2">
                                        <span className="font-bold text-textMain text-lg leading-none">{stat.label}</span>
                                        <span className="text-xs text-textMuted font-mono bg-white/5 px-2 py-1 rounded">{stat.total} Workouts</span>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {Object.entries(stat.counts).map(([split, count]) => (
                                            <div key={split} className="flex items-center gap-2 bg-surface border border-border px-3 py-1.5 rounded-lg">
                                                <span className="text-xs font-bold text-textMuted uppercase tracking-wider">{split}</span>
                                                <span className={`text-sm font-bold ${staticData.color}`}>{count}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                            {focusStats.length === 0 && <div className="text-center text-textMuted text-sm py-4 italic">No workout history found.</div>}
                        </div>
                    </div>
                    {showWeightChart && <ProgressChart data={weightHistory} color={staticData.color} type="Weight" onClose={() => setShowWeightChart(false)} />}
                    {showBMIChart && <ProgressChart data={bmiHistory} color={staticData.color} type="BMI" onClose={() => setShowBMIChart(false)} />}
                </div>
            );
        };

        const Layout = () => {
            const [view, setView] = useState("main");
            const [selectedProfile, setSelectedProfile] = useState(null);
            const [scrollY, setScrollY] = useState(0);
            const [currentDate, setCurrentDate] = useState(getTodayDateString());
            const [tab, setTab] = useState("raghendh");
            const [isAuth, setIsAuth] = useState(false);
            const [authError, setAuthError] = useState(null);
            const [allHistory, setAllHistory] = useState(null);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initApp = () => {
                    if (window.auth && window.db) {
                        unsubscribeAuth = window.auth.onAuthStateChanged((user) => {
                            if (user) {
                                setIsAuth(true);
                                window.onValue(window.ref(window.db, '/'), (snapshot) => {
                                    if (snapshot.exists()) setAllHistory(snapshot.val());
                                });
                            } else { window.signInAnonymously(window.auth).catch(err => setAuthError(err)); }
                        });
                        return true;
                    }
                    return false;
                };
                if (!initApp()) {
                    const interval = setInterval(() => { if (initApp()) clearInterval(interval); }, 100);
                    return () => { clearInterval(interval); if (unsubscribeAuth) unsubscribeAuth(); };
                }
                return () => { if (unsubscribeAuth) unsubscribeAuth(); };
            }, []);

            useEffect(() => {
                window.history.replaceState({ view: 'main' }, '');
                const handlePopState = (e) => {
                    if (e.state && e.state.view) { setView(e.state.view); if (e.state.selectedProfile) setSelectedProfile(e.state.selectedProfile); else setSelectedProfile(null); }
                    else setView('main');
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            useEffect(() => {
                let wakeLock = null;
                const requestWakeLock = async () => {
                    if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
                };
                requestWakeLock();
                const handleVisibilityChange = () => { if (document.visibilityState === 'visible') requestWakeLock(); };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => { document.removeEventListener('visibilitychange', handleVisibilityChange); if (wakeLock !== null) wakeLock.release().catch(console.error); };
            }, []);

            const handleScroll = (e) => { setScrollY(e.currentTarget.scrollTop); };
            const shrinkProgress = Math.min(scrollY / 150, 1);

            if (authError) return <SetupScreen error={authError} />;
            if (!isAuth) return (
                <div className="h-screen bg-bg flex flex-col items-center justify-center relative overflow-hidden">
                    <div className="absolute top-1/4 left-1/4 w-64 h-64 rounded-full bg-green-900/20 blur-[120px] pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-64 h-64 rounded-full bg-emerald-900/10 blur-[120px] pointer-events-none"></div>
                    <div className="relative z-10 flex flex-col items-center scale-in">
                        <div className="relative mb-10">
                            <div className="absolute inset-0 rounded-[2rem] bg-primary/20 blur-2xl scale-110"></div>
                            <div className="relative w-28 h-28 rounded-[2rem] bg-surface border border-white/10 flex items-center justify-center pulse-ring-green">
                                <span className="font-teko text-6xl font-bold text-white leading-none tracking-tight">DOD</span>
                            </div>
                        </div>
                        <p className="text-textMuted text-xs uppercase tracking-[0.3em] mb-8 font-medium">Do or Die</p>
                        <div className="relative h-0.5 w-40 bg-surfaceLight rounded-full overflow-hidden shimmer">
                            <div className="absolute inset-y-0 left-0 w-1/2 bg-gradient-to-r from-transparent via-primary to-transparent animate-[shimmer_1.4s_ease-in-out_infinite]"></div>
                        </div>
                    </div>
                </div>
            );

            const themes = {
                raghendh: { text: 'text-primary', bg: 'bg-primary', shadow: 'neon-green', gradient: 'from-green-500 to-emerald-500' },
                devanandh: { text: 'text-secondary', bg: 'bg-secondary', shadow: 'neon-orange', gradient: 'from-orange-500 to-amber-500' }
            };

            const handleProfileSelect = (key) => {
                setSelectedProfile(key);
                setView('profile-detail');
                window.history.pushState({ view: 'profile-detail', selectedProfile: key }, '');
            };

            return (
                <div className="max-w-md mx-auto h-screen text-textMain relative overflow-hidden flex flex-col font-sans" style={{ background: '#0d0d0f' }}>
                    <div className="absolute top-[-15%] left-[-15%] w-[60%] h-[50%] rounded-full bg-green-950/20 blur-[150px] pointer-events-none"></div>
                    <div className="absolute bottom-[-10%] right-[-15%] w-[55%] h-[45%] rounded-full bg-blue-950/15 blur-[120px] pointer-events-none"></div>

                    <main className="flex-1 overflow-y-auto no-scrollbar scroll-smooth px-5 pb-5" onScroll={handleScroll}>
                        <div className="pt-6 pb-2">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h1 className="font-teko text-3xl font-bold leading-none tracking-wide text-white">DO OR DIE</h1>
                                    <div className="relative inline-block">
                                        <p className="text-[10px] font-bold text-textMuted uppercase tracking-widest flex items-center gap-1">
                                            {currentDate === getTodayDateString() ? formatDatePretty() : formatDisplayDate(currentDate)}
                                            <i className="ph-bold ph-caret-down text-[8px]"></i>
                                        </p>
                                        <input type="date" value={currentDate} onChange={(e) => setCurrentDate(e.target.value)} className="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10" />
                                    </div>
                                </div>
                                <button onClick={() => {
                                    if (view === 'main') { setView('profiles'); window.history.pushState({ view: 'profiles' }, ''); }
                                    else { setView('main'); window.history.pushState({ view: 'main' }, ''); }
                                }} className={`w-9 h-9 rounded-full border flex items-center justify-center transition-all duration-300 ${view !== 'main' ? 'bg-textMain border-textMain text-bg scale-110' : 'bg-surface border-white/10 text-textMuted hover:border-white/20 hover:text-textMain'}`}>
                                    {view === 'main' ? <i className="ph-bold ph-user"></i> : <i className="ph-bold ph-house"></i>}
                                </button>
                            </div>
                        </div>

                        {view === 'main' && (
                            <div className="tab-content">
                                <div className="sticky top-0 z-40 py-2.5 border-b border-white/[0.05] mb-4 -mx-5 px-5 shadow-[0_4px_20px_rgba(0,0,0,0.5)] transition-all" style={{ background: '#0d0d0f' }}>
                                    <div className="flex gap-3">
                                        <StopwatchWidget label="Ragh" colorClass="text-primary" shadowClass="shadow-neon-green" progress={shrinkProgress} />
                                        <StopwatchWidget label="Dev" colorClass="text-secondary" shadowClass="shadow-neon-orange" progress={shrinkProgress} />
                                    </div>
                                </div>

                                {tab === 'raghendh' && <Dashboard userKey="raghendh" allHistory={allHistory} colorTheme={themes.raghendh} date={currentDate} />}
                                {tab === 'devanandh' && <Dashboard userKey="devanandh" allHistory={allHistory} colorTheme={themes.devanandh} date={currentDate} />}
                                {tab === 'history' && <Timeline historyData={allHistory} />}
                                {tab === 'pr' && <PRWidget historyData={allHistory} />}
                                {tab === 'program' && <ProgramWidget />}
                            </div>
                        )}

                        {view === 'profiles' && <ProfileSelector onSelect={handleProfileSelect} />}
                        {view === 'profile-detail' && selectedProfile && <ProfileStats userKey={selectedProfile} allHistory={allHistory} onBack={() => window.history.back()} />}
                    </main>

                    {view === 'main' && (
                        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-50">
                            <nav className="nav-pill rounded-2xl px-2 py-2 flex items-center gap-1">
                                {[
                                    { id: 'raghendh', icon: 'ph-barbell', activeColor: 'bg-primary text-white nav-active-green' },
                                    { id: 'devanandh', icon: 'ph-sneaker-move', activeColor: 'bg-secondary text-white nav-active-orange' },
                                    { id: 'history', icon: 'ph-clock-counter-clockwise', activeColor: 'bg-textMain text-bg nav-active-white' },
                                    { id: 'pr', icon: 'ph-trophy', activeColor: 'bg-textMain text-bg nav-active-white' },
                                    { id: 'program', icon: 'ph-clipboard-text', activeColor: 'bg-textMain text-bg nav-active-white' }
                                ].map(item => {
                                    const isActive = tab === item.id;
                                    return (
                                        <button key={item.id} onClick={() => setTab(item.id)} className={`w-12 h-12 rounded-xl flex items-center justify-center transition-all duration-300 ${isActive ? item.activeColor : 'text-textMuted hover:bg-white/5 hover:text-textMain'}`} style={{ transform: isActive ? 'scale(1.08)' : 'scale(1)' }}>
                                            <i className={`${isActive ? 'ph-fill' : 'ph-bold'} ${item.icon} text-xl`}></i>
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Layout />);

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(console.error); });
        }
    </script>
</body>
</html>
