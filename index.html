            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDatePretty = () => {
            const date = new Date();
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        const formatDisplayDate = (isoDate) => {
            if (!isoDate) return "";
            const [y, m, d] = isoDate.split('-');
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        const calculateAge = (dobString) => {
            const dob = new Date(dobString);
            const diff_ms = Date.now() - dob.getTime();
            const age_dt = new Date(diff_ms);
            return Math.abs(age_dt.getUTCFullYear() - 1970);

                    const date = new Date(item.date);
                    let key;
                    if (filter === 'week') {
                        const onejan = new Date(date.getFullYear(), 0, 1);
                        const week = Math.ceil((((date.getTime() - onejan.getTime()) / 86400000) + onejan.getDay() + 1) / 7);
                        key = `${date.getFullYear()}-W${week}`;
                    } else if (filter === 'month') {
                        key = `${date.getFullYear()}-${date.getMonth() + 1}`;
                    } else if (filter === 'year') {
                        key = `${date.getFullYear()}`;
                    }
                    if (!grouped[key]) grouped[key] = { sum: 0, count: 0, label: key };
                    grouped[key].sum += parseFloat(item.value);
                    grouped[key].count += 1;
                });
                return Object.values(grouped).map(g => ({ date: g.label, value: (g.sum / g.count).toFixed(1) })).slice(-12);
            }, [data, filter]);

            const width = 100, height = 60, paddingX = 10, paddingY = 10;
            const graphWidth = width - paddingX * 2, graphHeight = height - paddingY * 2;
            const vals = chartData.map(d => parseFloat(d.value));
            const minVal = vals.length ? Math.min(...vals) - 1 : 0;
            const maxVal = vals.length ? Math.max(...vals) + 1 : 10;
            const range = maxVal - minVal;
            const strokeHex = color.includes('primary') ? '#22c55e' : '#f97316';

            const points = useMemo(() => {
                if (chartData.length < 2) return [];
                const step = graphWidth / (chartData.length - 1);
                return chartData.map((d, i) => {
                    const x = paddingX + i * step;
                    const y = (height - paddingY) - ((parseFloat(d.value) - minVal) / range) * graphHeight;
                    return [x, y];
                });
            }, [chartData, minVal, range, graphWidth, graphHeight]);

            const linePath = useMemo(() => {
                if (points.length === 0) return "";
                return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]},${p[1]}`).join(" ");
            }, [points]);

            const areaPath = useMemo(() => {
                if (points.length === 0) return "";
                const lastPoint = points[points.length - 1];
                const firstPoint = points[0];
                return `${linePath} L ${lastPoint[0]},${height - paddingY} L ${firstPoint[0]},${height - paddingY} Z`;
            }, [linePath, points, height, paddingY]);

            const formatDateLabel = (label) => {
                if(filter === 'day') { const d = new Date(label); return `${d.getDate()}/${d.getMonth()+1}`; }
                if(filter === 'month') { const [y, m] = label.split('-'); const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return months[parseInt(m)-1]; }
                return label.split('-').pop();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl fade-in">
                    <div className="bg-surface/50 border border-white/10 rounded-[2rem] w-full max-w-sm p-8 relative shadow-2xl overflow-hidden backdrop-blur-md">
                        <div className={`absolute top-0 left-1/2 -translate-x-1/2 w-40 h-40 rounded-full blur-[80px] opacity-20 pointer-events-none ${color.replace('text-', 'bg-')}`}></div>
                        <button onClick={onClose} className="absolute top-4 right-4 text-textMuted hover:text-white p-2 rounded-full hover:bg-white/10 transition-colors z-20">
                            <i className="ph-bold ph-x text-xl"></i>
                        </button>
                        <div className="relative z-10 text-center">
                            <h3 className="text-4xl font-teko font-bold text-textMain mb-0 leading-none uppercase tracking-wide">{type} Progress</h3>
                            <p className="text-xs text-textMuted mb-8 uppercase tracking-[0.2em] font-medium">Analytics Overview</p>
                            <div className="flex bg-black/40 rounded-xl p-1 mb-8 backdrop-blur-sm border border-white/5">
                                {['day', 'week', 'month', 'year'].map(f => (
                                    <button key={f} onClick={() => setFilter(f)} className={`flex-1 py-2 rounded-lg text-[10px] font-bold uppercase transition-all ${filter === f ? 'bg-textMain text-bg shadow-lg' : 'text-textMuted hover:text-white'}`}>{f}</button>
                                ))}
                            </div>
                            <div className="h-56 w-full mb-2 relative">
                                {chartData.length > 0 ? (
                                    <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full h-full overflow-visible font-mono text-[3px]">
                                        <defs>
                                            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="0%" stopColor={strokeHex} stopOpacity="0.3" />
                                                <stop offset="100%" stopColor={strokeHex} stopOpacity="0" />
                                            </linearGradient>
                                        </defs>
                                        {[0, 0.5, 1].map((ratio, i) => {
                                            const y = (height - paddingY) - (graphHeight * ratio);
                                            const val = (minVal + (range * ratio)).toFixed(1);
                                            return (
                                                <g key={i}>
                                                    <line x1={paddingX} y1={y} x2={width - paddingX} y2={y} stroke="rgba(255,255,255,0.05)" strokeWidth="0.2" strokeDasharray="1,1" />
                                                    <text x={width - paddingX + 2} y={y + 1} fill="#71717a" textAnchor="start">{val}</text>
                                                </g>
                                            )
                                        })}
                                        {chartData.length > 1 && (
                                            <>
                                                <text x={paddingX} y={height - 2} fill="#71717a" textAnchor="middle">{formatDateLabel(chartData[0].date)}</text>
                                                <text x={width/2} y={height - 2} fill="#71717a" textAnchor="middle">{formatDateLabel(chartData[Math.floor(chartData.length/2)].date)}</text>
                                                <text x={width - paddingX} y={height - 2} fill="#71717a" textAnchor="middle">{formatDateLabel(chartData[chartData.length-1].date)}</text>
                                            </>
                                        )}
                                        <path d={areaPath} fill="url(#chartGradient)" />
                                        <path d={linePath} fill="none" stroke={strokeHex} strokeWidth="0.8" strokeLinecap="round" strokeLinejoin="round" filter={`drop-shadow(0 0 4px ${strokeHex})`} />
                                        {(() => {
                                            const last = points[points.length - 1];
                                            if(!last) return null;
                                            return <g><circle cx={last[0]} cy={last[1]} r="2" fill={strokeHex} opacity="0.3" className="animate-ping" /><circle cx={last[0]} cy={last[1]} r="1.5" fill="white" /></g>;
                                        })()}
                                    </svg>
                                ) : (
                                    <div className="flex flex-col items-center justify-center h-full text-textMuted opacity-50">
                                        <i className="ph-duotone ph-chart-line-up text-4xl mb-2"></i>
                                        <span className="text-xs">No data available</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTS ---
        const SetupScreen = ({ error }) => (
            <div className="min-h-screen bg-bg flex flex-col items-center justify-center p-6 text-center">
                <div className="w-20 h-20 rounded-3xl bg-surface border border-border flex items-center justify-center mb-6 shadow-neon-purple animate-pulse">
                    <i className="ph-fill ph-warning text-4xl text-primary"></i>
                </div>
                <h1 className="text-2xl font-bold text-textMain mb-2">Connection Issue</h1>
                <p className="text-textMuted text-sm">{error?.message || "Could not connect to Firebase."}</p>
            </div>
        );

        const StopwatchWidget = ({ label, colorClass, shadowClass, progress = 0 }) => {
            const [time, setTime] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const timerRef = useRef(null);
            const bgClass = colorClass.replace('text-', 'bg-');
            const lerp = (start, end, p) => start + (end - start) * p;
            const heightRem = lerp(11, 5, progress);
            const timeSizeRem = lerp(4.5, 2.5, progress);
            const labelSizeRem = lerp(3, 1.25, progress);
            const paddingRem = lerp(1.25, 0.75, progress);
            const subElementOpacity = Math.max(0, 1 - (progress * 2.5));

            const toggle = () => {
                if (isRunning) { clearInterval(timerRef.current); setIsRunning(false); setTime(0); }
                else {
                    const startTime = Date.now() - time;
                    timerRef.current = setInterval(() => { setTime(Date.now() - startTime); }, 50);
                    setIsRunning(true);
                }
            };

            const format = (ms) => ({ mins: Math.floor(ms / 60000).toString().padStart(2, '0'), secs: Math.floor((ms % 60000) / 1000).toString().padStart(2, '0') });
            const { mins, secs } = format(time);
            const decis = Math.floor((time % 1000) / 100);

            return (
                <div onClick={toggle} className={`relative flex-1 rounded-[2rem] cursor-pointer overflow-hidden transition-all duration-300 active:scale-95 border flex flex-col justify-between group ${isRunning ? `${bgClass} border-transparent scale-[1.02]` : `border-white/[0.06]`}`}
                    style={{ background: isRunning ? undefined : 'linear-gradient(160deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 100%)', boxShadow: isRunning ? (colorClass.includes('primary') ? '0 8px 32px rgba(34,197,94,0.3), 0 2px 8px rgba(34,197,94,0.2)' : '0 8px 32px rgba(249,115,22,0.3), 0 2px 8px rgba(249,115,22,0.2)') : '0 2px 12px rgba(0,0,0,0.3)', height: `${heightRem}rem`, padding: `${paddingRem}rem`, transition: 'height 0.1s linear, padding 0.1s linear, box-shadow 0.3s ease' }}>
                    {!isRunning && <div className={`absolute -right-6 -top-6 w-28 h-28 rounded-full blur-3xl ${bgClass}`} style={{ opacity: 0.15 * subElementOpacity }}></div>}
                    {isRunning && <div className="absolute inset-0 opacity-10"><div className={`absolute -right-8 -bottom-8 w-40 h-40 rounded-full blur-3xl bg-white`}></div></div>}
                    <div className="relative z-10 mt-1" style={{ lineHeight: 1 }}>
                        <span className={`font-teko font-bold tracking-wide uppercase block transition-colors ${isRunning ? 'text-white/80' : `${colorClass} opacity-90`}`} style={{ fontSize: `${labelSizeRem}rem`, transition: 'font-size 0.1s linear' }}>{label}</span>
                    </div>
                    <div className="flex items-baseline gap-0.5 relative z-10 mb-1">
                        <span className={`font-teko font-semibold leading-[0.75] tracking-tight transition-colors ${isRunning ? 'text-white' : 'text-textMain'}`} style={{ fontSize: `${timeSizeRem}rem`, transition: 'font-size 0.1s linear' }}>{mins}:{secs}</span>
                        <span className={`font-teko text-4xl font-light w-8 transition-colors ${isRunning ? 'text-white/70 tick-pulse' : 'text-textMuted'}`} style={{ opacity: subElementOpacity, transition: 'opacity 0.1s linear' }}>{decis}</span>
                    </div>
                    <div className={`absolute bottom-5 right-5 w-2 h-2 rounded-full transition-all duration-300 ${isRunning ? 'bg-white animate-pulse scale-125' : 'bg-white/10'}`} style={{ opacity: subElementOpacity }}></div>
                </div>
            );
        };

        const ExerciseCard = ({ exercise, exIndex, updateExercise, deleteExercise, suggestionList, isExpanded, onToggleExpand, userKey, allHistory, colorTheme, currentDate }) => {
            const [showRemark, setShowRemark] = useState(!!exercise.remark);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [showPrevSets, setShowPrevSets] = useState(false);
            const [showAllHistory, setShowAllHistory] = useState(false);
            const [showPrevNote, setShowPrevNote] = useState(false);
            const [showPRCalc, setShowPRCalc] = useState(false);
            const [prPercent, setPrPercent] = useState(50);
            
            const filteredSuggestions = useMemo(() => {
                if (!exercise.name) return suggestionList.slice(0, 5);
                const lowerInput = normalize(exercise.name);
                return suggestionList.filter(s => s.includes(lowerInput)).slice(0, 5);
            }, [exercise.name, suggestionList]);

            const exerciseHistoryList = useMemo(() => {
                if(!allHistory || !exercise.name) return [];
                const targetName = normalize(exercise.name);
                const list = [];
                const sortedDates = Object.keys(allHistory).sort().reverse();
                for (const date of sortedDates) {
                    if (date === currentDate) continue;
                    const dayData = allHistory[date];
                    const uData = dayData[userKey];
                    if (uData && uData.exercises) {
                        const found = uData.exercises.find(ex => normalize(ex.name) === targetName);
                        if (found) list.push({ date, ...found });
                    }
                }
                return list;
            }, [allHistory, exercise.name, userKey, currentDate]);

            const previousSession = exerciseHistoryList.length > 0 ? exerciseHistoryList[0] : null;

            const currentPRs = useMemo(() => {
                if (!allHistory || !exercise.name) return { bilateral: 0, unilateral: 0 };
                let maxBi = 0, maxUni = 0;
                const targetName = normalize(exercise.name);
                Object.values(allHistory).forEach(dayData => {
                    const uData = dayData[userKey];
                    if (uData && uData.exercises) {
                        uData.exercises.forEach(ex => {
                            if (normalize(ex.name) === targetName && ex.sets) {
                                ex.sets.forEach(s => {
                                    const w = parseFloat(s.weight);
                                    if (!isNaN(w)) {
                                        if (s.uni && w > maxUni) maxUni = w;
                                        if (!s.uni && w > maxBi) maxBi = w;
                                    }
                                });
                            }
                        });
                    }
                });
                return { bilateral: maxBi, unilateral: maxUni };
            }, [allHistory, exercise.name, userKey]);

            const displayHistory = useMemo(() => {
                if (showAllHistory) return exerciseHistoryList;
                const summary = [];
                const seen = new Set();
                if (exerciseHistoryList.length > 0) { summary.push({ ...exerciseHistoryList[0], tag: "Last Session" }); seen.add(exerciseHistoryList[0].date); }
                if (currentPRs.bilateral > 0) {
                    const biSession = exerciseHistoryList.find(s => (s.sets || []).some(set => !set.uni && parseFloat(set.weight) === currentPRs.bilateral));
                    if (biSession && !seen.has(biSession.date)) { summary.push({ ...biSession, tag: "Max Bilateral" }); seen.add(biSession.date); }
                }
                if (currentPRs.unilateral > 0) {
                    const uniSession = exerciseHistoryList.find(s => (s.sets || []).some(set => set.uni && parseFloat(set.weight) === currentPRs.unilateral));
                    if (uniSession && !seen.has(uniSession.date)) { summary.push({ ...uniSession, tag: "Max Unilateral" }); seen.add(uniSession.date); }
                }
                return summary.sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [exerciseHistoryList, showAllHistory, currentPRs]);

            const hasPR = currentPRs.bilateral > 0 || currentPRs.unilateral > 0;
            const [prType, setPrType] = useState('bilateral');

            useEffect(() => {
                if (prType === 'bilateral' && currentPRs.bilateral === 0 && currentPRs.unilateral > 0) setPrType('unilateral');
                else if (prType === 'unilateral' && currentPRs.unilateral === 0 && currentPRs.bilateral > 0) setPrType('bilateral');
            }, [currentPRs, prType]);

            const addSet = () => updateExercise(exIndex, { ...exercise, sets: [...(exercise.sets || []), { weight: '', reps: '', uni: false }] });
            const updateSet = (sIndex, field, value) => { const newSets = [...exercise.sets]; newSets[sIndex][field] = value; updateExercise(exIndex, { ...exercise, sets: newSets }); };
            const removeSet = (sIndex) => updateExercise(exIndex, { ...exercise, sets: exercise.sets.filter((_, i) => i !== sIndex) });
            const handleNameSelect = (name) => { updateExercise(exIndex, { ...exercise, name: name }); setShowSuggestions(false); };
            const handleBlurName = () => { setTimeout(() => setShowSuggestions(false), 200); };

            if (!isExpanded) {
                return (
                    <div onClick={onToggleExpand} className="rounded-2xl p-4 mb-2 flex justify-between items-center cursor-pointer active:scale-[0.99] transition-all duration-200 group card-enter" style={{ background: '#161618', border: '1px solid rgba(255,255,255,0.07)' }}>
                        <div className="flex items-center gap-3">
                            <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${colorTheme.text}`} style={{ background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.08)' }}>
                                <span className="font-teko text-lg font-bold">{exIndex + 1}</span>
                            </div>
                            <div>
                                <h3 className="text-textMain font-semibold text-[15px] leading-tight uppercase tracking-wide">{exercise.name || "NEW EXERCISE"}</h3>
                                <div className="flex items-center gap-2 mt-0.5">
                                    <span className={`text-[10px] font-bold uppercase tracking-wider ${colorTheme.text}`} style={{ background: 'rgba(255,255,255,0.05)', padding: '1px 6px', borderRadius: 4 }}>{exercise.sets?.length || 0} Sets</span>
                                    {exercise.remark && <i className="ph-fill ph-note text-textMuted text-xs opacity-60"></i>}
                                </div>
                            </div>
                        </div>
                        <i className="ph-bold ph-caret-down text-textMuted/40 text-sm"></i>
                    </div>
                );
            }

            return (
                <div className="rounded-3xl mb-3 overflow-visible fade-in" style={{ background: '#161618', border: '1px solid rgba(255,255,255,0.1)', boxShadow: '0 4px 20px rgba(0,0,0,0.4)' }}>
                    <div className="p-5 border-b border-border flex justify-between items-start gap-4">
                        <div className="flex-1 relative">
                            <input value={exercise.name} onChange={(e) => { updateExercise(exIndex, {...exercise, name: e.target.value.toUpperCase()}); setShowSuggestions(true); }} onFocus={() => setShowSuggestions(true)} onBlur={handleBlurName} className="w-full bg-transparent text-2xl font-bold text-textMain placeholder-textMuted/30 border-none p-0 focus:ring-0 leading-none uppercase" placeholder="NAME..." autoComplete="off" />
                            {showSuggestions && filteredSuggestions.length > 0 && (
                                <ul className="absolute left-0 top-full w-full bg-surfaceLight border border-border rounded-xl mt-2 shadow-2xl z-50 max-h-48 overflow-y-auto overflow-x-hidden">
                                    {filteredSuggestions.map((suggestion, i) => (
                                        <li key={i} onMouseDown={(e) => { e.preventDefault(); handleNameSelect(suggestion); }} className="px-4 py-3 text-sm text-textMain hover:bg-white/10 cursor-pointer border-b border-white/5 last:border-0 uppercase">{suggestion}</li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div className="flex gap-1">
                            <button onClick={() => deleteExercise(exIndex)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20"><i className="ph-bold ph-trash"></i></button>
                            <button onClick={onToggleExpand} className="w-8 h-8 flex items-center justify-center rounded-lg bg-surface text-textMuted hover:bg-white/10"><i className="ph-bold ph-caret-up"></i></button>
                        </div>
                    </div>

                    <div className="flex items-center gap-2 px-5 py-3 border-b border-border bg-black/20 overflow-x-auto no-scrollbar">
                        {hasPR && (
                            <button onClick={() => setShowPRCalc(!showPRCalc)} className={`text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors whitespace-nowrap ${showPRCalc ? 'bg-secondary text-white shadow-neon-green' : 'bg-surface text-textMuted hover:text-textMain'}`}>
                                <i className="ph-bold ph-percent"></i> PR
                            </button>
                        )}
                        <button onClick={() => setShowPrevSets(!showPrevSets)} className={`text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors whitespace-nowrap ${showPrevSets ? 'bg-primary text-white shadow-neon-purple' : 'bg-surface text-textMuted hover:text-textMain'}`}>
                            <i className="ph-bold ph-clock-counter-clockwise"></i> History
                        </button>
                        <button onClick={() => setShowRemark(!showRemark)} className={`text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors whitespace-nowrap ${showRemark || exercise.remark ? 'bg-surfaceLight text-textMain border border-white/10' : 'bg-surface text-textMuted hover:text-textMain'}`}>
                            <i className="ph-bold ph-notebook"></i> Note
                        </button>
                        <button onClick={() => setShowPrevNote(!showPrevNote)} className={`w-8 h-8 rounded-lg flex items-center justify-center transition-colors ml-auto ${(previousSession && previousSession.remark) ? `${colorTheme.text} bg-white/5 border border-white/5` : 'text-textMuted bg-transparent opacity-50'}`} disabled={!previousSession}>
                            <i className="ph-bold ph-clock-counter-clockwise"></i>
                        </button>
                    </div>

                    {showPRCalc && hasPR && (
                        <div className="p-4 bg-black/20 border-b border-border">
                            <div className="flex justify-between items-center mb-2">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold text-textMuted uppercase tracking-wider">PR:</span>
                                    {currentPRs.bilateral > 0 && <button onClick={() => setPrType('bilateral')} className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase transition-colors ${prType === 'bilateral' ? 'bg-primary text-white' : 'bg-surface text-textMuted border border-border'}`}>Bil: {currentPRs.bilateral}kg</button>}
                                    {currentPRs.unilateral > 0 && <button onClick={() => setPrType('unilateral')} className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase transition-colors ${prType === 'unilateral' ? 'bg-secondary text-white' : 'bg-surface text-textMuted border border-border'}`}>Uni: {currentPRs.unilateral}kg</button>}
                                </div>
                                <span className="text-xl font-teko font-bold text-primary">{( (prType === 'bilateral' ? currentPRs.bilateral : currentPRs.unilateral) * prPercent / 100).toFixed(1)} <span className="text-xs text-textMuted font-sans">KG</span></span>
                            </div>
                            <input type="range" min="0" max="100" step="10" value={prPercent} onChange={(e) => setPrPercent(parseInt(e.target.value))} className="w-full h-2 bg-surfaceLight rounded-lg appearance-none cursor-pointer accent-primary" />
                            <div className="flex justify-between items-center mt-2">
                                <div className="flex justify-between w-full text-[10px] text-textMuted font-mono px-1"><span>0%</span><span>50%</span><span>100%</span></div>
                            </div>
                            <div className="text-center -mt-4"><span className="text-xs font-bold text-textMain bg-surface border border-border px-2 py-0.5 rounded">{prPercent}%</span></div>
                        </div>
                    )}

                    {showPrevSets && (
                        <div className="bg-black/40 p-0 border-b border-border flex flex-col">
                            {exerciseHistoryList.length > 0 ? (
                                <>
                                    <div className="flex gap-2 p-3 bg-surface/50 border-b border-white/5 text-center">
                                        <div className="flex-1 bg-white/5 rounded-lg p-1.5"><div className="text-[9px] text-textMuted uppercase tracking-wider mb-0.5">Sessions</div><div className="text-lg leading-none font-teko font-bold text-textMain">{exerciseHistoryList.length}</div></div>
                                        <div className="flex-1 bg-white/5 rounded-lg p-1.5"><div className="text-[9px] text-textMuted uppercase tracking-wider mb-0.5">Max Bil</div><div className="text-lg leading-none font-teko font-bold text-primary">{currentPRs.bilateral > 0 ? `${currentPRs.bilateral}kg` : '-'}</div></div>
                                        <div className="flex-1 bg-white/5 rounded-lg p-1.5"><div className="text-[9px] text-textMuted uppercase tracking-wider mb-0.5">Max Uni</div><div className="text-lg leading-none font-teko font-bold text-secondary">{currentPRs.unilateral > 0 ? `${currentPRs.unilateral}kg` : '-'}</div></div>
                                    </div>
                                    <div className="max-h-64 overflow-y-auto no-scrollbar p-3 space-y-3">
                                        {displayHistory.map((session, idx) => (
                                            <div key={idx} className="bg-surface/50 rounded-xl p-3 border border-white/5">
                                                <div className="flex justify-between items-center mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs font-bold text-textMuted uppercase tracking-wider">{formatDisplayDate(session.date)}</span>
                                                        {session.tag && <span className="text-[9px] bg-white/10 text-textMuted px-1.5 py-0.5 rounded font-bold uppercase tracking-widest">{session.tag}</span>}
                                                    </div>
                                                </div>
                                                <div className="space-y-1">
                                                    {(session.sets || []).map((s, i) => {
                                                        const isPRBi = !s.uni && parseFloat(s.weight) === currentPRs.bilateral && currentPRs.bilateral > 0;
                                                        const isPRUni = s.uni && parseFloat(s.weight) === currentPRs.unilateral && currentPRs.unilateral > 0;
                                                        const isPR = isPRBi || isPRUni;
                                                        return (
                                                            <div key={i} className={`flex justify-between items-center text-sm font-mono px-2 py-1.5 rounded ${isPR ? 'bg-primary/20 text-primary font-bold' : 'bg-white/5 text-textMain'}`}>
                                                                <span className="flex items-center gap-2">{s.weight}kg x {s.reps}{isPR && <i className="ph-fill ph-trophy text-[10px]"></i>}</span>
                                                                {s.uni && <span className={`text-[10px] uppercase border px-1 rounded ${isPR ? 'border-primary/50 text-primary' : 'text-textMuted border-white/20'}`}>Uni</span>}
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                                {session.remark && <div className="mt-2 text-[10px] text-textMuted italic pl-2 border-l-2 border-white/10">{session.remark}</div>}
                                            </div>
                                        ))}
                                        {exerciseHistoryList.length > displayHistory.length && !showAllHistory && (
                                            <button onClick={() => setShowAllHistory(true)} className="w-full py-2.5 mt-2 text-xs font-bold text-textMuted hover:text-white bg-white/5 rounded-xl transition-colors">Show All History ({exerciseHistoryList.length})</button>
                                        )}
                                        {showAllHistory && exerciseHistoryList.length > displayHistory.length && (
                                            <button onClick={() => setShowAllHistory(false)} className="w-full py-2.5 mt-2 text-xs font-bold text-textMuted hover:text-white bg-white/5 rounded-xl transition-colors">Show Less</button>
                                        )}
                                    </div>
                                </>
                            ) : (
                                <div className="p-4 text-sm text-textMuted italic">No previous history found.</div>
                            )}
                        </div>
                    )}

                    {showPrevNote && previousSession && (
                        <div className="p-4 bg-black/30 border-b border-border">
                            <div className="text-xs font-bold text-textMuted mb-1 uppercase tracking-wider">Note from {previousSession.date}:</div>
                            <div className="text-sm text-textMain italic pl-2 border-l-2 border-white/20">{previousSession.remark || "No note recorded."}</div>
                        </div>
                    )}

                    {showRemark && (
                        <div className="p-4 bg-black/20 border-b border-border">
                            <textarea value={exercise.remark || ""} onChange={(e) => updateExercise(exIndex, {...exercise, remark: e.target.value})} placeholder="Add technical cues or notes..." className="w-full bg-surfaceLight/50 text-sm text-textMain placeholder-textMuted/50 rounded-xl p-3 border-none focus:ring-1 focus:ring-primary/50 resize-none min-h-[60px]" />
                        </div>
                    )}

                    <div className="p-4">
                        <div className="grid grid-cols-[30px_1fr_1fr_40px_30px] gap-2 mb-2 text-[10px] font-bold text-textMuted uppercase tracking-wider text-center items-center">
                            <span>#</span><span>KG</span><span>Reps</span><span>Uni</span><span></span>
                        </div>
                        <div className="space-y-2">
                            {(exercise.sets || []).map((set, sIndex) => (
                                <div key={sIndex} className="grid grid-cols-[30px_1fr_1fr_40px_30px] gap-2 items-center">
                                    <div className="flex items-center justify-center h-10 rounded-lg bg-surface text-textMuted font-mono text-sm">{sIndex + 1}</div>
                                    <div className="h-10 relative"><input type="number" value={set.weight} onChange={(e) => updateSet(sIndex, 'weight', e.target.value)} className="w-full h-full rounded-lg glass-input text-center text-textMain font-teko text-xl focus:ring-0" placeholder="-" /></div>
                                    <div className="h-10 relative"><input type="number" value={set.reps} onChange={(e) => updateSet(sIndex, 'reps', e.target.value)} className="w-full h-full rounded-lg glass-input text-center text-textMain font-teko text-xl focus:ring-0" placeholder="-" /></div>
                                    <button onClick={() => updateSet(sIndex, 'uni', !set.uni)} className={`h-10 rounded-lg flex items-center justify-center border transition-all ${set.uni ? 'bg-primary border-primary text-white shadow-neon-purple' : 'bg-surface border-border text-textMuted'}`}><span className="text-xs font-bold">U</span></button>
                                    <button onClick={() => removeSet(sIndex)} className="h-10 flex items-center justify-center text-textMuted hover:text-red-400 transition-colors"><i className="ph-bold ph-x"></i></button>
                                </div>
                            ))}
                        </div>
                        <button onClick={addSet} className="mt-4 w-full py-3.5 rounded-xl border border-dashed border-white/20 text-textMuted hover:text-textMain hover:bg-white/5 hover:border-white/40 transition-all flex items-center justify-center gap-2 text-sm font-medium">
                            <i className="ph-bold ph-plus"></i> Add Set
                        </button>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ userKey, allHistory, colorTheme, date }) => {
            const [split, setSplit] = useState("");
            const [bodyWeight, setBodyWeight] = useState("");
            const [exercises, setExercises] = useState([]);
            const [status, setStatus] = useState("");
            const [expandedIndex, setExpandedIndex] = useState(-1);

            const suggestionList = useMemo(() => {
                const historySet = new Set();
                if (allHistory) {
                    Object.values(allHistory).forEach(dateObj => {
                        ['raghendh', 'devanandh'].forEach(u => {
                            const userData = dateObj[u];
                            if (userData?.exercises) userData.exercises.forEach(e => { if (e.name) historySet.add(normalize(e.name)); });
                        });
                    });
                }
                return Array.from(historySet).sort();
            }, [allHistory]);

            useEffect(() => {
                if (!allHistory || !userKey) return;
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                const yYear = yesterday.getFullYear();
                const yMonth = String(yesterday.getMonth() + 1).padStart(2, '0');
                const yDay = String(yesterday.getDate()).padStart(2, '0');
                const yStr = `${yYear}-${yMonth}-${yDay}`;
                const dayData = allHistory[yStr];
                if (!dayData || !dayData[userKey]) {
                    window.update(window.ref(window.db, `${yStr}/${userKey}`), { split: "Rest", exercises: [] }).catch(console.error);
                }
            }, [allHistory, userKey]);

            useEffect(() => {
                if (!window.db) return;
                const unsubscribe = window.onValue(window.ref(window.db, `${date}`), (snapshot) => {
                    const data = snapshot.val() || {};
                    const userData = data[userKey] || {};
                    setSplit(data.split || userData.split || "");
                    setBodyWeight(userData.bodyWeight || "");
                    setExercises(userData.exercises || []);
                });
                return () => unsubscribe();
            }, [userKey, date]);

            const updateSharedSplit = (toggledSplit) => {
                let newSplitValue;
                const currentSplits = split ? split.split(', ') : [];
                if (toggledSplit === "Rest") { newSplitValue = "Rest"; }
                else {
                    let list = currentSplits.filter(s => s !== "Rest");
                    if (list.includes(toggledSplit)) list = list.filter(s => s !== toggledSplit);
                    else list.push(toggledSplit);
                    newSplitValue = list.join(', ');
                }
                setSplit(newSplitValue);
                window.update(window.ref(window.db, date), { split: newSplitValue }).catch(console.error);
            };

            const updatePersonalData = async (updates) => {
                setStatus("Saving...");
                try {
                    let cleanExercises = exercises;
                    if (updates.exercises) cleanExercises = updates.exercises.map(ex => ({...ex, name: normalize(ex.name)}));
                    const personalUpdate = {};
                    if(updates.bodyWeight !== undefined) personalUpdate.bodyWeight = updates.bodyWeight;
                    if(updates.exercises !== undefined) personalUpdate.exercises = cleanExercises;
                    if (Object.keys(personalUpdate).length > 0) await window.update(window.ref(window.db, `${date}/${userKey}`), personalUpdate);
                    setStatus("Saved"); setTimeout(() => setStatus(""), 1500);
                } catch (e) { setStatus("Error"); }
            };

            const handleAddExercise = () => {
                const newEx = [...exercises, { name: "", sets: [{weight: '', reps: '', uni: false}] }];
                setExercises(newEx);
                setExpandedIndex(newEx.length - 1);
                updatePersonalData({ exercises: newEx });
            };
            const handleUpdateExercise = (index, data) => { const newEx = [...exercises]; newEx[index] = data; setExercises(newEx); updatePersonalData({ exercises: newEx }); };
            const handleDeleteExercise = (index) => { const newEx = exercises.filter((_, i) => i !== index); setExercises(newEx); setExpandedIndex(-1); updatePersonalData({ exercises: newEx }); };

            const splitsList = ["Push", "Pull", "Legs", "Quads", "Hamstrings", "Upper", "Lower", "Full Body", "Cardio", "Arms", "Abs", "Chest", "Shoulder","Back","Rest"];

            return (
                <div className="fade-in pb-24">
                    <div className="rounded-2xl p-5 mb-4" style={{ background: '#161618', border: '1px solid rgba(255,255,255,0.07)', borderLeft: `3px solid ${colorTheme.text === 'text-primary' ? '#22c55e' : '#f97316'}` }}>
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <div className="text-[10px] font-bold text-textMuted uppercase tracking-widest mb-1">Today's Session</div>
                                <h1 className={`text-3xl font-teko font-bold tracking-wide leading-none ${colorTheme.text}`}>{userKey === 'raghendh' ? 'RAGHENDH' : 'DEVANANDH'}</h1>
                            </div>
                            <div className="rounded-xl px-3 py-2 text-right" style={{ background: '#1e1e22', border: '1px solid rgba(255,255,255,0.07)' }}>
                                <div className="text-[10px] font-bold text-textMuted uppercase tracking-wider mb-0.5">Body Weight</div>
                                <div className="flex items-baseline gap-1 justify-end">
                                    <input type="number" value={bodyWeight} onChange={(e) => { setBodyWeight(e.target.value); updatePersonalData({bodyWeight: e.target.value}); }} placeholder="--" className="w-12 bg-transparent text-xl font-teko font-bold text-textMain border-none p-0 focus:ring-0 text-right" />
                                    <span className="text-[10px] text-textMuted">kg</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest mb-2 block">Session Focus</label>
                            <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1 -mx-1 px-1">
                                {splitsList.map(s => {
                                    const isSelected = split && split.split(', ').includes(s);
                                    const isRest = s === 'Rest';
                                    return (
                                        <button key={s} onClick={() => updateSharedSplit(s)} className="whitespace-nowrap px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all border"
                                            style={{ background: isSelected ? (isRest ? '#555' : (colorTheme.text === 'text-primary' ? 'rgba(34,197,94,0.15)' : 'rgba(249,115,22,0.15)')) : '#1e1e22', borderColor: isSelected ? (isRest ? '#666' : (colorTheme.text === 'text-primary' ? '#22c55e' : '#f97316')) : 'rgba(255,255,255,0.07)', color: isSelected ? (isRest ? '#ddd' : (colorTheme.text === 'text-primary' ? '#22c55e' : '#f97316')) : '#8a8a96' }}>
                                            {s}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="space-y-1">
                        {exercises.map((ex, i) => (
                            <ExerciseCard key={i} exercise={ex} exIndex={i} updateExercise={handleUpdateExercise} deleteExercise={handleDeleteExercise} suggestionList={suggestionList} isExpanded={i === expandedIndex} onToggleExpand={() => setExpandedIndex(i === expandedIndex ? -1 : i)} userKey={userKey} allHistory={allHistory} colorTheme={colorTheme} currentDate={date} />
                        ))}
                    </div>

                    <button onClick={handleAddExercise} className={`fixed bottom-[88px] right-5 w-14 h-14 rounded-2xl ${colorTheme.bg} flex items-center justify-center text-white hover:scale-110 active:scale-95 transition-all duration-200 z-40 border border-white/20`}
                        style={{ boxShadow: colorTheme.bg.includes('primary') ? '0 8px 24px rgba(34,197,94,0.4), 0 2px 8px rgba(34,197,94,0.3)' : '0 8px 24px rgba(249,115,22,0.4), 0 2px 8px rgba(249,115,22,0.3)' }}>
                        <i className="ph-bold ph-plus text-2xl"></i>
                    </button>

                    {status && (
                        <div className="fixed bottom-[88px] left-5 bg-surface/80 backdrop-blur-md border border-border text-textMain px-4 py-2 rounded-xl text-xs font-bold shadow-2xl flex items-center gap-2 fade-in z-50">
                            <div className={`w-2 h-2 rounded-full ${colorTheme.bg}`}></div> {status}
                        </div>
                    )}
                </div>
            );
        };

        const Timeline = ({ historyData }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [expandedDate, setExpandedDate] = useState(null);
            const [viewRemarks, setViewRemarks] = useState({});
            const toggleRemark = (id) => setViewRemarks(prev => ({...prev, [id]: !prev[id]}));

            const allExerciseNames = useMemo(() => {
                const uniqueNames = new Set();
                if (historyData) {
                    Object.values(historyData).forEach(dateObj => {
                        ['raghendh', 'devanandh'].forEach(u => {
                            dateObj[u]?.exercises?.forEach(e => { if(e.name) uniqueNames.add(normalize(e.name)); });
                        });
                    });
                }
                return Array.from(uniqueNames).sort();
            }, [historyData]);

            const dates = Object.keys(historyData || {}).filter(k => k.match(/^\d{4}-\d{2}-\d{2}$/)).sort().reverse();

            const searchResults = useMemo(() => {
                if (!searchTerm) return null;
                const term = normalize(searchTerm);
                if (!term) return null;
                const res = { raghendh: [], devanandh: [] };
                dates.forEach(date => {
                    const dayData = historyData[date];
                    ['raghendh', 'devanandh'].forEach(u => {
                        if (dayData[u]?.exercises) {
                            dayData[u].exercises.forEach(ex => {
                                if (ex.name && normalize(ex.name).includes(term)) res[u].push({ date, split: dayData.split || dayData[u].split, bw: dayData[u].bodyWeight, exercise: ex });
                            });
                        }
                    });
                });
                return res;
            }, [searchTerm, historyData, dates]);

            return (
                <div className="pb-24 pt-2 fade-in">
                    <div className="glass-panel rounded-2xl p-2 mb-4 flex items-center gap-3" style={{ boxShadow: '0 4px 16px rgba(0,0,0,0.3)' }}>
                        <div className="w-10 h-10 rounded-xl bg-surface flex items-center justify-center text-textMuted"><i className="ph-bold ph-magnifying-glass text-xl"></i></div>
                        <input list="history-search" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Search history..." className="bg-transparent border-none flex-1 text-textMain placeholder-textMuted focus:ring-0 text-sm font-medium uppercase" />
                        {searchTerm && <button onClick={() => setSearchTerm("")} className="w-10 h-10 flex items-center justify-center text-textMuted hover:text-white"><i className="ph-fill ph-x-circle text-xl"></i></button>}
                        <datalist id="history-search">{allExerciseNames.map((name, i) => <option key={i} value={name} />)}</datalist>
                    </div>

                    {searchTerm && searchResults ? (
                        <div className="space-y-4">
                            {['raghendh', 'devanandh'].map(u => (
                                <div key={u}>
                                    <h3 className={`text-xs font-black uppercase tracking-widest mb-3 pl-2 ${u === 'raghendh' ? 'text-primary' : 'text-secondary'}`}>{u}</h3>
                                    <div className="space-y-3">
                                        {searchResults[u].map((item, i) => (
                                            <div key={i} className="glass-panel rounded-2xl p-4 border-l-4 border-l-surfaceLight relative overflow-hidden">
                                                <div className={`absolute left-0 top-0 bottom-0 w-1 ${u === 'raghendh' ? 'bg-primary' : 'bg-secondary'}`}></div>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-xs font-bold text-textMuted bg-surface px-2 py-1 rounded-lg">{item.date}</span>
                                                    {item.bw && <span className="text-[10px] text-textMuted">BW: {item.bw}kg</span>}
                                                </div>
                                                <h4 className="font-bold text-textMain mb-2 uppercase">{item.exercise.name}</h4>
                                                <div className="flex flex-wrap gap-2">
                                                    {item.exercise.sets?.map((s, si) => (
                                                        <div key={si} className="bg-surface border border-border px-2 py-1 rounded text-xs font-mono text-textMain flex items-center gap-1">
                                                            {s.weight}kg x {s.reps}{s.uni && <span className="text-[9px] text-textMuted uppercase border-l border-white/10 pl-1 ml-1">U</span>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="space-y-3 relative">
                            <div className="absolute left-[19px] top-4 bottom-0 w-0.5 bg-border z-0"></div>
                            {dates.map(dateStr => {
                                const dayData = historyData[dateStr];
                                if (!dayData) return null;
                                const splitName = dayData.split || dayData.raghendh?.split || dayData.devanandh?.split || '-';
                                const isExpanded = expandedDate === dateStr;
                                return (
                                    <div key={dateStr} className="relative z-10 pl-10">
                                        <div className="absolute left-0 top-1 w-10 h-10 rounded-full bg-surface border-4 border-bg flex items-center justify-center text-textMuted text-[10px] font-bold shadow-sm">{dateStr.split('-')[2]}</div>
                                        <div className="glass-panel rounded-2xl mb-4 overflow-hidden">
                                            <div className="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 transition-colors" onClick={() => setExpandedDate(isExpanded ? null : dateStr)}>
                                                <div className="flex-1 pr-4">
                                                    <div className="text-xs font-bold text-textMuted uppercase tracking-wider mb-1">{new Date(dateStr).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</div>
                                                    <div className="text-lg font-bold text-textMain leading-tight">{splitName}</div>
                                                </div>
                                                <div className={`w-8 h-8 rounded-full bg-surface flex items-center justify-center transition-transform duration-300 flex-shrink-0 ${isExpanded ? 'rotate-180' : ''}`}><i className="ph-bold ph-caret-down text-textMuted"></i></div>
                                            </div>
                                            {isExpanded && (
                                                <div className="border-t border-border bg-black/20 p-4">
                                                    <div className="grid grid-cols-2 gap-4 divide-x divide-border">
                                                        {['raghendh', 'devanandh'].map(u => {
                                                            const uData = dayData[u];
                                                            const color = u === 'raghendh' ? 'text-primary' : 'text-secondary';
                                                            return (
                                                                <div key={u} className={u === 'devanandh' ? 'pl-4' : ''}>
                                                                    <div className={`text-[10px] font-black uppercase mb-3 ${color}`}>{u}</div>
                                                                    {uData?.bodyWeight && <div className="text-[10px] mb-3 text-textMuted bg-surface inline-block px-2 py-0.5 rounded">BW: {uData.bodyWeight}kg</div>}
                                                                    <div className="space-y-4">
                                                                        {(uData?.exercises || []).map((ex, i) => {
                                                                            const id = `${dateStr}-${u}-${i}`;
                                                                            return (
                                                                                <div key={i}>
                                                                                    <div className="text-xs font-bold text-textMain uppercase mb-1 truncate">{ex.name}</div>
                                                                                    <div className="space-y-1">
                                                                                        {(ex.sets || []).map((s, si) => (
                                                                                            <div key={si} className="text-xs font-mono text-textMuted flex justify-between items-center">
                                                                                                <span>{s.weight}kg x {s.reps}{s.uni && <span className="ml-1 text-[9px] text-textMuted border border-white/20 px-1 rounded">U</span>}</span>
                                                                                            </div>
                                                                                        ))}
                                                                                    </div>
                                                                                    {ex.remark && <button onClick={(e) => { e.stopPropagation(); toggleRemark(id); }} className="mt-1 text-[10px] text-textMuted hover:text-white flex items-center gap-1"><i className="ph-fill ph-note"></i> Note</button>}
                                                                                    {viewRemarks[id] && <div className="text-[10px] text-textMuted italic mt-1 pl-2 border-l-2 border-white/10">{ex.remark}</div>}
                                                                                </div>
                                                                            );
                                                                        })}
                                                                        {(!uData?.exercises || uData.exercises.length === 0) && <span className="text-[10px] text-white/20 italic">Rest Day</span>}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const PRWidget = ({ historyData }) => {
            const [selectedUser, setSelectedUser] = useState('raghendh');
            const [searchTerm, setSearchTerm] = useState("");

            const prs = useMemo(() => {
                if (!historyData) return [];
                const records = {};
                Object.values(historyData).forEach(day => {
                    const uData = day[selectedUser];
                    if (uData?.exercises) {
                        uData.exercises.forEach(ex => {
                            if (!ex.name) return;
                            const name = normalize(ex.name);
                            if (!records[name]) records[name] = { bi: 0, uni: 0 };
                            if (ex.sets) {
                                ex.sets.forEach(s => {
                                    const w = parseFloat(s.weight);
                                    if (!isNaN(w)) {
                                        if (s.uni && w > records[name].uni) records[name].uni = w;
                                        if (!s.uni && w > records[name].bi) records[name].bi = w;
                                    }
                                });
                            }
                        });
                    }
                });
                return Object.entries(records).filter(([_, r]) => r.bi > 0 || r.uni > 0).map(([name, r]) => ({ name, bi: r.bi, uni: r.uni })).sort((a, b) => Math.max(b.bi, b.uni) - Math.max(a.bi, a.uni));
            }, [historyData, selectedUser]);

            const filteredPRs = prs.filter(p => p.name.includes(normalize(searchTerm)));

            return (
                <div className="pb-24 pt-2 fade-in px-2">
                    <h2 className="text-2xl font-teko font-bold text-textMain mb-1 uppercase tracking-wide">Personal Records</h2>
                    <p className="text-[10px] text-textMuted uppercase tracking-widest mb-5">All-time bests</p>
                    <div className="flex bg-surface rounded-xl p-1 border border-white/[0.06] mb-4" style={{ boxShadow: '0 2px 8px rgba(0,0,0,0.3)' }}>
                        {['raghendh', 'devanandh'].map(u => (
                            <button key={u} onClick={() => setSelectedUser(u)} className={`flex-1 py-2 rounded-lg text-xs font-bold uppercase transition-all ${selectedUser === u ? 'bg-textMain text-bg shadow-md' : 'text-textMuted'}`}>{u}</button>
                        ))}
                    </div>
                    <div className="glass-panel rounded-xl p-2 mb-4 flex items-center gap-2">
                        <i className="ph-bold ph-magnifying-glass text-textMuted pl-2"></i>
                        <input value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Search exercise..." className="bg-transparent border-none w-full text-sm text-textMain placeholder-textMuted focus:ring-0" />
                    </div>
                    <div className="space-y-2">
                        {filteredPRs.map((pr, i) => (
                            <div key={i} className="glass-panel rounded-xl p-4 flex justify-between items-center hover:bg-white/[0.04] transition-all duration-200 card-enter" style={{ animationDelay: `${i * 40}ms` }}>
                                <div className="flex items-center gap-3 w-1/2">
                                    <div className={`w-1 h-8 rounded-full ${selectedUser === 'raghendh' ? 'bg-primary' : 'bg-secondary'} opacity-60`}></div>
                                    <span className="font-bold text-textMain uppercase text-sm truncate pr-2">{pr.name}</span>
                                </div>
                                <div className="flex items-center gap-3 w-1/2 justify-end text-right">
                                    {pr.bi > 0 && <div className="flex flex-col items-end leading-none"><span className="text-[9px] text-textMuted uppercase tracking-wider font-bold mb-0.5">Bil</span><div className="flex items-baseline gap-0.5"><span className="text-xl font-teko font-bold text-primary">{pr.bi}</span><span className="text-[10px] text-textMuted">kg</span></div></div>}
                                    {pr.uni > 0 && <div className="flex flex-col items-end leading-none"><span className="text-[9px] text-textMuted uppercase tracking-wider font-bold mb-0.5">Uni</span><div className="flex items-baseline gap-0.5"><span className="text-xl font-teko font-bold text-secondary">{pr.uni}</span><span className="text-[10px] text-textMuted">kg</span></div></div>}
                                </div>
                            </div>
                        ))}
                        {filteredPRs.length === 0 && <div className="text-center text-textMuted text-xs py-8">No records found.</div>}
                    </div>
                </div>
            );
        };

        const Catalog = ({ historyData }) => {
            const [selectedSplit, setSelectedSplit] = useState("Push");
            const splits = ["Push", "Pull", "Legs", "Quads", "Hamstrings", "Upper", "Lower", "Full Body", "Cardio", "Arms", "Abs", "Chest", "Shoulder","Back"];
            const exercises = useMemo(() => {
                const uniqueSet = new Set();
                const displayList = [];
                if(historyData) {
                    Object.values(historyData).forEach(day => {
                        const daySplit = day.split || day.raghendh?.split || day.devanandh?.split;
                        if(daySplit && daySplit.split(', ').includes(selectedSplit)) {
                            ['raghendh', 'devanandh'].forEach(u => {
                                if(day[u]?.exercises) {
                                    day[u].exercises.forEach(e => {
                                        if(e.name) { const clean = normalize(e.name); if(!uniqueSet.has(clean)) { uniqueSet.add(clean); displayList.push(clean); } }
                                    });
                                }
                            });
                        }
                    });
                }
                return displayList.sort();
            }, [historyData, selectedSplit]);

            return (
                <div className="pb-24 pt-2 fade-in">
                    <h2 className="text-xl font-bold text-textMain mb-4 px-2">Exercise Catalog</h2>
                    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2 px-2 -mx-2 mb-4">
                        {splits.map(s => <button key={s} onClick={() => setSelectedSplit(s)} className={`whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold border transition-all ${selectedSplit === s ? 'bg-textMain text-bg border-textMain' : 'bg-surface border-border text-textMuted hover:bg-surfaceLight'}`}>{s}</button>)}
                    </div>
                    <div className="glass-panel rounded-3xl p-1 min-h-[300px]">
                        {exercises.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-64 text-textMuted opacity-50"><i className="ph-duotone ph-barbell text-4xl mb-2"></i><p className="text-sm">No exercises found</p></div>
                        ) : (
                            <div className="grid grid-cols-1 divide-y divide-white/5">
                                {exercises.map((ex, i) => (
                                    <div key={i} className="p-4 flex items-center gap-4 hover:bg-white/5 transition-colors first:rounded-t-3xl last:rounded-b-3xl">
                                        <div className="w-8 h-8 rounded-lg bg-surface flex items-center justify-center text-primary"><i className="ph-fill ph-check-circle"></i></div>
                                        <span className="text-sm font-medium text-textMain uppercase flex-1">{ex}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- FIX 2: Persist activeDay across tab switches using module-level variable ---
        let _persistedProgramDay = 1;

        const ProgramWidget = () => {
            // FIX 2: Initialize from persisted value, update on change
            const [activeDay, _setActiveDay] = useState(_persistedProgramDay);
            const setActiveDay = (id) => { _persistedProgramDay = id; _setActiveDay(id); };

            const [expandedEx, setExpandedEx] = useState(null);
            const [activeTab, setActiveTab] = useState("split");
            const [addModal, setAddModal] = useState(null);
            const [addTarget, setAddTarget] = useState("raghendh");
            const [addSets, setAddSets] = useState(3);
            const [addReps, setAddReps] = useState("");
            const [addStatus, setAddStatus] = useState("");
            // FIX 3: Set type for advanced exercise modalities
            const [addSetType, setAddSetType] = useState("standard"); // standard | dropset | superset | timed | pyramid
            const [addExercise2, setAddExercise2] = useState(""); // for superset
            // Drop set: weights per drop (array)
            const [dropWeights, setDropWeights] = useState(["", "", ""]);
            // Pyramid: auto from tag
            const [pyramidRounds, setPyramidRounds] = useState(2);

            const currentDay = DAYS.find((d) => d.id === activeDay);

            const openAddModal = (ex, dayColor) => {
                setAddModal({ ex, dayColor });
                setAddTarget("raghendh");
                setAddSets(parseInt(ex.sets) || 3);
                setAddReps(ex.reps || "");
                setAddStatus("");
                setAddExercise2("");
                setDropWeights(["", "", ""]);
                // Auto-detect set type from tag
                const tag = ex.tag || "";
                if (tag.includes("DROP SET") || tag.includes("↓")) setAddSetType("dropset");
                else if (tag.includes("SUPERSET")) setAddSetType("superset");
                else if (tag.includes("PYRAMID")) setAddSetType("pyramid");
                else if (tag.includes("BURNOUT")) { setAddSetType("standard"); }
                else setAddSetType("standard");
            };

            const confirmAddExercise = async () => {
                if (!addModal || !window.db) return;
                const today = getTodayDateString();
                try {
                    setAddStatus("Adding...");
                    const snap = await window.get(window.child(window.ref(window.db), `${today}/${addTarget}`));
                    const existing = snap.val() || {};
                    const currentExercises = existing.exercises || [];
                    let newExercises = [];

                    if (addSetType === "standard" || addSetType === "timed") {
                        const repsVal = addReps.split('–')[0] || addReps.split('-')[0] || addReps;
                        const newSets = Array.from({ length: addSets }, () => ({
                            weight: '',
                            reps: addSetType === "timed" ? addReps : repsVal,
                            uni: false,
                            ...(addSetType === "timed" ? { timed: true } : {})
                        }));
                        newExercises = [{ name: normalize(addModal.ex.name), sets: newSets }];
                    } else if (addSetType === "dropset") {
                        // Each drop is a set with a note marker
                        const repsVal = addReps.split('–')[0] || addReps.split('-')[0] || addReps;
                        const rounds = addSets;
                        const sets = [];
                        for (let r = 0; r < rounds; r++) {
                            const numDrops = dropWeights.filter(w => w !== "").length || 3;
                            for (let d = 0; d < numDrops; d++) {
                                sets.push({ weight: dropWeights[d] || '', reps: repsVal, uni: false, drop: true, dropIndex: d });
                            }
                        }
                        newExercises = [{ name: normalize(addModal.ex.name), sets, setType: "dropset" }];
                    } else if (addSetType === "superset") {
                        const repsVal = addReps.split('–')[0] || addReps.split('-')[0] || addReps;
                        const sets1 = Array.from({ length: addSets }, () => ({ weight: '', reps: repsVal, uni: false }));
                        const sets2 = Array.from({ length: addSets }, () => ({ weight: '', reps: repsVal, uni: false }));
                        newExercises = [
                            { name: normalize(addModal.ex.name), sets: sets1, setType: "superset", supersetWith: normalize(addExercise2 || "EXERCISE 2") },
                            { name: normalize(addExercise2 || "EXERCISE 2"), sets: sets2, setType: "superset", supersetWith: normalize(addModal.ex.name) }
                        ];
                    } else if (addSetType === "pyramid") {
                        // Ascending pyramid: sets at different rep targets
                        const pyramidSets = [];
                        // Standard CBum pyramid: 20/15/10/fail per round, 2 rounds
                        const repTargets = ["20", "15", "10", "fail"];
                        for (let r = 0; r < pyramidRounds; r++) {
                            repTargets.forEach(rep => {
                                pyramidSets.push({ weight: '', reps: rep, uni: false });
                            });
                        }
                        newExercises = [{ name: normalize(addModal.ex.name), sets: pyramidSets, setType: "pyramid" }];
                    }

                    const updated = [...currentExercises, ...newExercises];
                    await window.update(window.ref(window.db, `${today}/${addTarget}`), { exercises: updated });
                    setAddStatus("Added ✓");
                    setTimeout(() => { setAddModal(null); setAddStatus(""); }, 900);
                } catch (e) {
                    setAddStatus("Error. Try again.");
                }
            };

            const SET_TYPE_OPTIONS = [
                { id: "standard", label: "Standard", icon: "ph-list-numbers", desc: "Same weight all sets" },
                { id: "dropset", label: "Drop Set", icon: "ph-arrow-fat-down", desc: "Reduce weight, no rest" },
                { id: "superset", label: "Superset", icon: "ph-link", desc: "2 exercises, no rest" },
                { id: "timed", label: "Timed", icon: "ph-timer", desc: "Log duration not weight" },
                { id: "pyramid", label: "Pyramid", icon: "ph-triangle", desc: "Ascending reps/weight" },
            ];

            return (
                <div className="fade-in pb-24 pt-2">
                    {/* --- FIX 3: Enhanced Add Modal --- */}
                    {addModal && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center" style={{ background: 'rgba(0,0,0,0.78)' }} onClick={() => setAddModal(null)}>
                            <div className="w-full max-w-md rounded-t-3xl pb-10 overflow-y-auto max-h-[90vh]" style={{ background: '#161618', border: '1px solid rgba(255,255,255,0.1)', borderBottom: 'none', marginBottom: '80px' }} onClick={e => e.stopPropagation()}>
                                <div className="sticky top-0 z-10 pt-6 px-6 pb-4" style={{ background: '#161618' }}>
                                    <div className="w-10 h-1 rounded-full bg-white/20 mx-auto mb-5"></div>
                                    <div className="flex items-start gap-3">
                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ background: addModal.dayColor + '22', border: `1px solid ${addModal.dayColor}44` }}>
                                            <i className="ph-bold ph-barbell" style={{ color: addModal.dayColor }}></i>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            {/* FIX 1 (in modal): Show full exercise name without truncation */}
                                            <div className="text-[10px] font-bold text-textMuted uppercase tracking-widest mb-0.5">Add Exercise</div>
                                            <div className="text-base font-bold text-textMain leading-tight break-words">{addModal.ex.name}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="px-6 pb-2">
                                    {/* Set Type Selector */}
                                    <div className="mb-5">
                                        <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Set Type</label>
                                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                            {SET_TYPE_OPTIONS.map(opt => (
                                                <button key={opt.id} onClick={() => setAddSetType(opt.id)}
                                                    className="shrink-0 flex flex-col items-center gap-1 px-3 py-2.5 rounded-xl border transition-all"
                                                    style={{ background: addSetType === opt.id ? '#3b82f620' : '#1e1e22', borderColor: addSetType === opt.id ? '#3b82f6' : 'rgba(255,255,255,0.07)', color: addSetType === opt.id ? '#3b82f6' : '#8a8a96', minWidth: 72 }}>
                                                    <i className={`ph-bold ${opt.icon} text-base`}></i>
                                                    <span className="text-[10px] font-bold uppercase">{opt.label}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="text-[10px] text-textMuted mt-1.5 ml-1">{SET_TYPE_OPTIONS.find(o => o.id === addSetType)?.desc}</div>
                                    </div>

                                    {/* Target user */}
                                    <div className="mb-4">
                                        <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Add To</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['raghendh', 'devanandh'].map(u => (
                                                <button key={u} onClick={() => setAddTarget(u)}
                                                    className={`py-2.5 rounded-xl text-sm font-bold transition-all border ${addTarget === u ? (u === 'raghendh' ? 'border-primary text-primary' : 'border-secondary text-secondary') : 'border-border text-textMuted'}`}
                                                    style={{ background: addTarget === u ? (u === 'raghendh' ? 'rgba(34,197,94,0.1)' : 'rgba(249,115,22,0.1)') : '#1e1e22' }}>
                                                    {u === 'raghendh' ? 'Raghendh' : 'Devanandh'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* STANDARD / TIMED */}
                                    {(addSetType === "standard" || addSetType === "timed") && (
                                        <div className="grid grid-cols-2 gap-3 mb-5">
                                            <div>
                                                <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">Sets</label>
                                                <div className="flex items-center gap-2 rounded-xl border border-border p-2" style={{ background: '#1e1e22' }}>
                                                    <button onClick={() => setAddSets(s => Math.max(1, s - 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted hover:text-textMain transition-colors" style={{ background: '#161618' }}><i className="ph-bold ph-minus text-sm"></i></button>
                                                    <span className="flex-1 text-center font-teko text-2xl font-bold text-textMain">{addSets}</span>
                                                    <button onClick={() => setAddSets(s => Math.min(10, s + 1))} className="w-8 h-8 rounded-lg flex items-center justify-center text-textMuted hover:text-textMain transition-colors" style={{ background: '#161618' }}><i className="ph-bold ph-plus text-sm"></i></button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-textMuted uppercase tracking-widest block mb-2">
                                                    {addSetType === "timed" ? "Duration (sec)" : "Target Reps"}
                                                </label>
                                                <input type="text" value={addReps} onChange={e => setAddReps(e.target.value)} placeholder={addSetType === "timed" ? "e.g. 30" : (addModal.ex.reps || "e.g. 8-10")} className="w-full rounded-xl px-3 py-2.5 text-sm font-medium text-textMain placeholder-textMuted/40 focus:ring-0 border border-border" style={{ background: '#1e1e22' }} />
                                            </div>
                                        </div>
                                    )}

                                    {/* DROP SET */}
                                    {addSetType === "dropset" && (
                                        <div className="mb-5">
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <div>
